services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://aetherscan:aetherscan@db:5432/aetherscan}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      APP_NAME: ${APP_NAME:-AetherScan}
      USER_AGENT: ${USER_AGENT:-AetherScan/1.0 (+https://aetherscan.example)}
      SCANNER_TIMEOUT_SECONDS: ${SCANNER_TIMEOUT_SECONDS:-120}
      SCANNER_CONCURRENCY: ${SCANNER_CONCURRENCY:-8}
      API_KEY_ENABLED: ${API_KEY_ENABLED:-true}
      API_KEYS: ${API_KEYS:-}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-60}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_KEY_PREFIX: ${RATE_LIMIT_KEY_PREFIX:-aetherscan:rate-limit}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET must be set}
      AUTH_ACCESS_TOKEN_MINUTES: ${AUTH_ACCESS_TOKEN_MINUTES:-15}
      AUTH_REFRESH_TOKEN_DAYS: ${AUTH_REFRESH_TOKEN_DAYS:-30}
      AUTH_EMAIL_VERIFICATION_REQUIRED: ${AUTH_EMAIL_VERIFICATION_REQUIRED:-false}
      AUTH_EMAIL_VERIFICATION_HOURS: ${AUTH_EMAIL_VERIFICATION_HOURS:-24}
      AUTH_FRONTEND_URL: ${AUTH_FRONTEND_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/v1/auth/google/callback}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:8000/api/v1/auth/github/callback}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes: ["./app:/app/app"]
    healthcheck:
      {
        test:
          [
            "CMD",
            "python",
            "-c",
            "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
          ],
        interval: 10s,
        timeout: 5s,
        retries: 5,
      }
  worker:
    build: .
    command: arq app.workers.tasks.WorkerSettings
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://aetherscan:aetherscan@db:5432/aetherscan}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      APP_NAME: ${APP_NAME:-AetherScan}
      USER_AGENT: ${USER_AGENT:-AetherScan/1.0 (+https://aetherscan.example)}
      SCANNER_TIMEOUT_SECONDS: ${SCANNER_TIMEOUT_SECONDS:-120}
      SCANNER_CONCURRENCY: ${SCANNER_CONCURRENCY:-8}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes: ["./app:/app/app"]
  migrator:
    build: .
    command: alembic upgrade head
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://aetherscan:aetherscan@db:5432/aetherscan}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
    depends_on: { db: { condition: service_healthy } }
  db:
    image: postgres:16-alpine
    environment:
    
      {
        POSTGRES_USER: aetherscan,
        POSTGRES_PASSWORD: aetherscan,
        POSTGRES_DB: aetherscan,
      }
    volumes: [postgres_data:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      {
        test: ["CMD-SHELL", "pg_isready -U aetherscan -d aetherscan"],
        interval: 5s,
        timeout: 5s,
        retries: 10,
      }
  redis:
    image: redis:7-alpine
    volumes: [redis_data:/data]
    healthcheck:
      {
        test: ["CMD", "redis-cli", "ping"],
        interval: 5s,
        timeout: 3s,
        retries: 10,
      }
volumes:
  postgres_data:
  redis_data:
