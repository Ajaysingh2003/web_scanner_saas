[project]
name = "aetherscan-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "gunicorn>=23,<24",
  "pydantic-settings>=2.7,<3.0",
  "sqlalchemy[asyncio]>=2.0.36,<3.0",
  "asyncpg>=0.30,<1.0",
  "alembic>=1.14,<2.0",
  "redis>=5.2,<6.0",
  "arq>=0.26,<1.0",
  "httpx>=0.28,<1.0",
  "dnspython>=2.7,<3.0",
  "beautifulsoup4>=4.12,<5.0",
  "python-multipart>=0.0.20,<1.0",
  "structlog>=25.1,<26.0",
  "cryptography>=44,<46",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
